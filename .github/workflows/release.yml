name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type to release'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      pre_release:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
          cache: true

      - name: Setup Homebrew cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/bin
            /opt/homebrew/lib
            /usr/local/bin
            /usr/local/lib
            ~/Library/Caches/Homebrew
            /home/linuxbrew/.linuxbrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('script/install_dev_requirement.sh') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Install dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 ./script/install_dev_requirement.sh

      - name: Get current version
        id: version
        run: |
          CURRENT_VERSION=$(grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' internal/cli/version.go | head -n1)
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Calculate new version
        id: calculate
        run: |
          VERSION="${{ steps.version.outputs.current }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ github.event.inputs.version_type }}" in
            patch)
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
              ;;
            minor)
              NEW_MINOR=$((MINOR + 1))
              NEW_VERSION="$MAJOR.$NEW_MINOR.0"
              ;;
            major)
              NEW_MAJOR=$((MAJOR + 1))
              NEW_VERSION="$NEW_MAJOR.0.0"
              ;;
          esac

          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Set release branch
        id: branch
        run: |
          BRANCH_NAME="codex/release-v${{ steps.calculate.outputs.new }}-${{ github.run_id }}"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH_NAME"

      - name: Update version files
        run: |
          sed -i '' 's/var Version = "${{ steps.version.outputs.current }}"/var Version = "${{ steps.calculate.outputs.new }}"/' internal/cli/version.go
          sed -E -i '' 's/^version="[0-9]+\.[0-9]+\.[0-9]+"$/version="${{ steps.calculate.outputs.new }}"/' script/install.sh
          cat internal/cli/version.go
          grep '^version="' script/install.sh

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Precheck
        run: |
          just precheck

      - name: Generate docs
        run: |
          just gendocs

      - name: Run tests
        run: |
          just test

      - name: Validate release metadata
        run: |
          VERSION_IN_GO=$(grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' internal/cli/version.go | head -n1)
          VERSION_IN_SCRIPT=$(sh ./script/install.sh -v)

          if [ "$VERSION_IN_GO" != "${{ steps.calculate.outputs.new }}" ]; then
            echo "internal/cli/version.go version mismatch: $VERSION_IN_GO"
            exit 1
          fi

          if [ "$VERSION_IN_SCRIPT" != "${{ steps.calculate.outputs.new }}" ]; then
            echo "script/install.sh version mismatch: $VERSION_IN_SCRIPT"
            exit 1
          fi

      - name: Commit release changes to branch
        run: |
          case "${{ github.event.inputs.version_type }}" in
            patch)
              COMMIT_MSG=":bookmark: new patch version"
              ;;
            minor)
              COMMIT_MSG=":bookmark: new minor version"
              ;;
            major)
              COMMIT_MSG=":bookmark: new major version"
              ;;
          esac
          git checkout -b "${{ steps.branch.outputs.name }}"
          git add -A
          git commit -m "$COMMIT_MSG"
          git push --set-upstream origin "${{ steps.branch.outputs.name }}"

      - name: Create release pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY=$(cat <<EOF
          Automated release PR for v${{ steps.calculate.outputs.new }}.

          Release-Version: ${{ steps.calculate.outputs.new }}
          Pre-Release: ${{ github.event.inputs.pre_release }}

          After this PR is merged into master, the publish workflow will create the git tag and GitHub Release.
          EOF
          )

          PR_URL=$(gh pr create \
            --base master \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Release v${{ steps.calculate.outputs.new }}" \
            --body "$PR_BODY")

          echo "url=$PR_URL" >> $GITHUB_OUTPUT
          echo "Created PR: $PR_URL"

      - name: Write summary
        run: |
          {
            echo "Release PR created:"
            echo "${{ steps.pr.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
